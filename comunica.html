<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Comunica — Apoyo para la comunicación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F5F6F1;
    --surface: #FFFFFF;
    --ink: #1F2A2E;
    --ink-soft: #55605F;
    --line: #DDE2D9;
    --primary: #E8871E;
    --primary-ink: #3A2000;
    --focus: #1F6FEB;

    /* Paleta funcional: clave Fitzgerald, usada en tableros reales de CAA
       para que el color enseñe la categoría gramatical, no decore. */
    --cat-personas: #F4D35E;
    --cat-personas-ink: #4A3B00;
    --cat-acciones: #6FA85E;
    --cat-acciones-ink: #FFFFFF;
    --cat-descripcion: #5B8DBE;
    --cat-descripcion-ink: #FFFFFF;
    --cat-objetos: #D98A4F;
    --cat-objetos-ink: #3A1F00;
    --cat-preguntas: #9B7EBD;
    --cat-preguntas-ink: #FFFFFF;
    --cat-social: #E893B3;
    --cat-social-ink: #4A0E22;

    --radius: 18px;
    --touch-min: 88px;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0; height:100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Atkinson Hyperlegible', system-ui, -apple-system, sans-serif;
  }

  body{
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  :focus-visible{
    outline: 4px solid var(--focus);
    outline-offset: 2px;
  }

  /* ---------- Encabezado ---------- */
  header{
    background: var(--surface);
    border-bottom: 2px solid var(--line);
    padding: 14px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:700;
    font-size: 1.3rem;
  }
  .brand-mark{
    width:40px; height:40px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--cat-acciones), var(--cat-descripcion));
    display:flex; align-items:center; justify-content:center;
    font-size:1.3rem;
  }

  .mode-toggle{
    display:flex;
    background: var(--bg);
    border: 2px solid var(--line);
    border-radius: 999px;
    padding: 4px;
    gap:4px;
  }
  .mode-toggle button{
    border:none;
    background:transparent;
    font-family:inherit;
    font-size:1rem;
    font-weight:700;
    padding: 10px 20px;
    min-height: 52px;
    border-radius: 999px;
    cursor:pointer;
    color: var(--ink-soft);
  }
  .mode-toggle button[aria-pressed="true"]{
    background: var(--ink);
    color: #fff;
  }

  /* ---------- Categorías (modo pictogramas) ---------- */
  .categorias{
    display:flex;
    gap:10px;
    padding: 12px 16px;
    overflow-x:auto;
    background: var(--bg);
  }
  .cat-chip{
    flex: 0 0 auto;
    border: none;
    border-radius: 999px;
    padding: 10px 18px;
    min-height: var(--touch-min);
    min-height: 56px;
    font-family:inherit;
    font-weight:700;
    font-size: 1rem;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:8px;
    border: 3px solid transparent;
    opacity:0.55;
  }
  .cat-chip[aria-pressed="true"]{
    opacity:1;
    border-color: var(--ink);
  }

  /* ---------- Área principal ---------- */
  main{
    flex:1;
    display:flex;
    flex-direction:column;
    padding: 8px 16px 16px;
    gap:16px;
  }

  .grid-pictogramas{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap:12px;
  }

  .pictograma{
    border: none;
    border-radius: var(--radius);
    min-height: 120px;
    padding: 10px 8px 12px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:6px;
    cursor:pointer;
    font-family:inherit;
    box-shadow: 0 2px 0 rgba(0,0,0,0.08);
  }
  .pictograma:active{ transform: translateY(2px); box-shadow:none; }
  .pictograma .emoji{ font-size: 2.4rem; line-height:1; }
  .pictograma .pictograma-img{
    width: 100%;
    max-width: 72px;
    aspect-ratio: 1 / 1;
    object-fit: contain;
  }
  .pictograma .palabra{ font-weight:700; font-size:1rem; text-align:center; }

  /* ---------- Modo texto ---------- */
  .modo-texto{
    display:flex;
    flex-direction:column;
    gap:14px;
    flex:1;
  }
  .modo-texto label{
    font-weight:700;
    font-size:1.1rem;
  }
  .modo-texto textarea{
    flex:1;
    min-height: 180px;
    font-family:inherit;
    font-size:1.4rem;
    padding:16px;
    border-radius: var(--radius);
    border: 2px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    resize: vertical;
  }
  .ayuda-texto{
    color: var(--ink-soft);
    font-size:0.95rem;
  }

  /* ---------- Barra inferior: frase construida ---------- */
  .barra-frase{
    background: var(--surface);
    border-top: 2px solid var(--line);
    padding: 12px 16px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .frase-actual{
    flex:1;
    min-height: 56px;
    border: 2px dashed var(--line);
    border-radius: var(--radius);
    padding: 8px 12px;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:8px;
  }
  .frase-actual:empty::before{
    content: "Toca pictogramas para armar una frase…";
    color: var(--ink-soft);
    font-style: italic;
  }
  .frase-chip{
    background: var(--bg);
    border-radius: 999px;
    padding: 6px 14px;
    font-weight:700;
    font-size:0.95rem;
  }

  .btn{
    font-family:inherit;
    font-weight:700;
    font-size:1.05rem;
    border:none;
    border-radius: 999px;
    min-height: var(--touch-min);
    min-width: var(--touch-min);
    padding: 10px 20px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  .btn-hablar{
    background: var(--primary);
    color: var(--primary-ink);
    font-size:1.2rem;
  }
  .btn-limpiar{
    background: var(--bg);
    color: var(--ink);
    border: 2px solid var(--line);
  }

  .visually-hidden{
    position:absolute;
    width:1px; height:1px;
    overflow:hidden;
    clip: rect(0 0 0 0);
    white-space:nowrap;
  }

  [hidden]{ display:none !important; }

  @media (max-width: 480px){
    .brand span:last-child{ display:none; }
    .grid-pictogramas{ grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); }
    .pictograma{ min-height:100px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">💬</span>
    <span>Comunica</span>
  </div>

  <div class="mode-toggle" role="group" aria-label="Elegir modo de comunicación">
    <button id="btn-modo-pictogramas" aria-pressed="true" onclick="cambiarModo('pictogramas')">
      🖼️ Pictogramas
    </button>
    <button id="btn-modo-texto" aria-pressed="false" onclick="cambiarModo('texto')">
      ⌨️ Escribir
    </button>
  </div>
</header>

<!-- MODO PICTOGRAMAS -->
<div id="vista-pictogramas">
  <nav class="categorias" id="lista-categorias" aria-label="Categorías de pictogramas"></nav>
  <main>
    <div class="grid-pictogramas" id="grid-pictogramas" role="list" aria-label="Pictogramas disponibles"></div>
  </main>
</div>

<!-- MODO TEXTO -->
<div id="vista-texto" hidden>
  <main>
    <div class="modo-texto">
      <label for="entrada-texto">Escribí lo que querés decir</label>
      <textarea id="entrada-texto" placeholder="Escribí aquí…" aria-describedby="ayuda-texto"></textarea>
      <p id="ayuda-texto" class="ayuda-texto">Presioná Enter o el botón "Hablar" para escuchar el texto en voz alta.</p>
    </div>
  </main>
</div>

<!-- BARRA INFERIOR (solo modo pictogramas) -->
<div class="barra-frase" id="barra-frase">
  <div class="frase-actual" id="frase-actual" role="status" aria-live="polite" aria-label="Frase construida"></div>
  <button class="btn btn-limpiar" onclick="limpiarFrase()" aria-label="Borrar frase">🗑️ Borrar</button>
  <button class="btn btn-hablar" onclick="hablarFrase()" aria-label="Reproducir frase en voz alta">🔊 Hablar</button>
</div>

<div id="anuncios" class="visually-hidden" aria-live="assertive"></div>

<script>
  /* =========================================================
     DATOS: cada pictograma es un objeto reutilizable también
     desde el backend a futuro. audioUrl queda en null hasta
     que el equipo de voces grabadas entregue los archivos;
     mientras tanto se usa speechSynthesis como respaldo.
     ========================================================= */

  const CATEGORIAS = [
    { id: 'personas',    nombre: 'Personas',   color: 'var(--cat-personas)',    colorInk: 'var(--cat-personas-ink)' },
    { id: 'acciones',    nombre: 'Acciones',   color: 'var(--cat-acciones)',    colorInk: 'var(--cat-acciones-ink)' },
    { id: 'descripcion', nombre: 'Descripción',color: 'var(--cat-descripcion)', colorInk: 'var(--cat-descripcion-ink)' },
    { id: 'objetos',     nombre: 'Objetos',    color: 'var(--cat-objetos)',     colorInk: 'var(--cat-objetos-ink)' },
    { id: 'preguntas',   nombre: 'Preguntas',  color: 'var(--cat-preguntas)',   colorInk: 'var(--cat-preguntas-ink)' },
    { id: 'social',      nombre: 'Social',     color: 'var(--cat-social)',      colorInk: 'var(--cat-social-ink)' },
  ];

  /* El campo "imagen" sigue la convención: nombre_de_la_palabra.png
     (minúscula, sin tildes, sin espacios), dentro de la carpeta pictogramas/.
     Si tus archivos tienen otro nombre, solo hay que editar ese valor. */
  const PICTOGRAMAS = [
    { id:'p001', palabra:'yo',        categoria:'personas',    emoji:'🙋', imagen:'pictogramas/yo.png',       audioUrl:null },
    { id:'p002', palabra:'vos',       categoria:'personas',    emoji:'👉', imagen:'pictogramas/vos.png',      audioUrl:null },
    { id:'p003', palabra:'mamá',      categoria:'personas',    emoji:'👩', imagen:'pictogramas/mama.png',     audioUrl:null },
    { id:'p004', palabra:'papá',      categoria:'personas',    emoji:'👨', imagen:'pictogramas/papa.png',     audioUrl:null },

    { id:'p010', palabra:'querer',    categoria:'acciones',    emoji:'🤲', imagen:'pictogramas/querer.png',   audioUrl:null },
    { id:'p011', palabra:'ir',        categoria:'acciones',    emoji:'🚶', imagen:'pictogramas/ir.png',       audioUrl:null },
    { id:'p012', palabra:'comer',     categoria:'acciones',    emoji:'🍽️', imagen:'pictogramas/comer.png',    audioUrl:null },
    { id:'p013', palabra:'jugar',     categoria:'acciones',    emoji:'🎲', imagen:'pictogramas/jugar.png',    audioUrl:null },
    { id:'p014', palabra:'ayudar',    categoria:'acciones',    emoji:'🤝', imagen:'pictogramas/ayudar.png',   audioUrl:null },

    { id:'p020', palabra:'feliz',     categoria:'descripcion', emoji:'😊', imagen:'pictogramas/feliz.png',    audioUrl:null },
    { id:'p021', palabra:'triste',    categoria:'descripcion', emoji:'😢', imagen:'pictogramas/triste.png',   audioUrl:null },
    { id:'p022', palabra:'cansado',   categoria:'descripcion', emoji:'😴', imagen:'pictogramas/cansado.png',  audioUrl:null },
    { id:'p023', palabra:'grande',    categoria:'descripcion', emoji:'📏', imagen:'pictogramas/grande.png',   audioUrl:null },

    { id:'p030', palabra:'agua',      categoria:'objetos',     emoji:'💧', imagen:'pictogramas/agua.png',     audioUrl:null },
    { id:'p031', palabra:'comida',    categoria:'objetos',     emoji:'🍞', imagen:'pictogramas/comida.png',   audioUrl:null },
    { id:'p032', palabra:'baño',      categoria:'objetos',     emoji:'🚻', imagen:'pictogramas/bano.png',     audioUrl:null },
    { id:'p033', palabra:'pelota',    categoria:'objetos',     emoji:'⚽', imagen:'pictogramas/pelota.png',   audioUrl:null },

    { id:'p040', palabra:'qué',       categoria:'preguntas',   emoji:'❓', imagen:'pictogramas/que.png',      audioUrl:null },
    { id:'p041', palabra:'dónde',     categoria:'preguntas',   emoji:'📍', imagen:'pictogramas/donde.png',    audioUrl:null },
    { id:'p042', palabra:'cuándo',    categoria:'preguntas',   emoji:'⏰', imagen:'pictogramas/cuando.png',   audioUrl:null },

    { id:'p050', palabra:'hola',      categoria:'social',      emoji:'👋', imagen:'pictogramas/hola.png',     audioUrl:null },
    { id:'p051', palabra:'gracias',   categoria:'social',      emoji:'🙏', imagen:'pictogramas/gracias.png',  audioUrl:null },
    { id:'p052', palabra:'sí',        categoria:'social',      emoji:'✅', imagen:'pictogramas/si.png',       audioUrl:null },
    { id:'p053', palabra:'no',        categoria:'social',      emoji:'🚫', imagen:'pictogramas/no.png',       audioUrl:null },
  ];

  /* =========================================================
     AUDIO: función única que abstrae la fuente del sonido.
     Cuando lleguen los audios grabados, solo hay que llenar
     audioUrl en cada objeto — esta función no cambia.
     ========================================================= */
  function reproducirTexto(texto, audioUrl){
    if (audioUrl){
      const audio = new Audio(audioUrl);
      audio.play();
      return;
    }
    if (!('speechSynthesis' in window)){
      anunciar('El navegador no soporta voz por síntesis.');
      return;
    }
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(texto);
    utterance.lang = 'es-ES';
    window.speechSynthesis.speak(utterance);
  }

  function anunciar(mensaje){
    document.getElementById('anuncios').textContent = mensaje;
  }

  /* =========================================================
     MODO: alternar entre pictogramas y texto
     ========================================================= */
  function cambiarModo(modo){
    const esPictogramas = modo === 'pictogramas';
    document.getElementById('vista-pictogramas').hidden = !esPictogramas;
    document.getElementById('vista-texto').hidden = esPictogramas;
    document.getElementById('barra-frase').hidden = !esPictogramas;
    document.getElementById('btn-modo-pictogramas').setAttribute('aria-pressed', String(esPictogramas));
    document.getElementById('btn-modo-texto').setAttribute('aria-pressed', String(!esPictogramas));
    if (!esPictogramas){
      document.getElementById('entrada-texto').focus();
    }
  }

  /* =========================================================
     MODO PICTOGRAMAS
     ========================================================= */
  let categoriaActiva = 'personas';
  let frase = [];

  function renderCategorias(){
    const cont = document.getElementById('lista-categorias');
    cont.innerHTML = '';
    CATEGORIAS.forEach(cat => {
      const btn = document.createElement('button');
      btn.className = 'cat-chip';
      btn.setAttribute('aria-pressed', String(cat.id === categoriaActiva));
      btn.style.background = cat.color;
      btn.style.color = cat.colorInk;
      btn.textContent = cat.nombre;
      btn.onclick = () => { categoriaActiva = cat.id; renderCategorias(); renderGrid(); };
      cont.appendChild(btn);
    });
  }

  function renderGrid(){
    const grid = document.getElementById('grid-pictogramas');
    grid.innerHTML = '';
    const cat = CATEGORIAS.find(c => c.id === categoriaActiva);
    PICTOGRAMAS.filter(p => p.categoria === categoriaActiva).forEach(p => {
      const btn = document.createElement('button');
      btn.className = 'pictograma';
      btn.style.background = cat.color;
      btn.style.color = cat.colorInk;
      btn.setAttribute('role', 'listitem');
      btn.setAttribute('aria-label', p.palabra);

      // Si hay imagen, se muestra el PNG; si falla al cargar, cae al emoji.
      const contenidoVisual = p.imagen
        ? `<img class="pictograma-img" src="${p.imagen}" alt=""
               onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'emoji',textContent:'${p.emoji}'}))">`
        : `<span class="emoji" aria-hidden="true">${p.emoji}</span>`;

      btn.innerHTML = `${contenidoVisual}<span class="palabra">${p.palabra}</span>`;
      btn.onclick = () => tocarPictograma(p);
      grid.appendChild(btn);
    });
  }

  function tocarPictograma(p){
    frase.push(p);
    renderFrase();
    reproducirTexto(p.palabra, p.audioUrl);
  }

  function renderFrase(){
    const cont = document.getElementById('frase-actual');
    cont.innerHTML = '';
    frase.forEach(p => {
      const chip = document.createElement('span');
      chip.className = 'frase-chip';
      chip.textContent = p.palabra;
      cont.appendChild(chip);
    });
  }

  function limpiarFrase(){
    frase = [];
    renderFrase();
    anunciar('Frase borrada');
  }

  function hablarFrase(){
    if (frase.length === 0){
      anunciar('No hay ninguna frase para reproducir');
      return;
    }
    const texto = frase.map(p => p.palabra).join(' ');
    reproducirTexto(texto, null); // frase completa siempre por síntesis (combinación libre)
  }

  /* =========================================================
     MODO TEXTO
     ========================================================= */
  const entradaTexto = document.getElementById('entrada-texto');
  entradaTexto.addEventListener('keydown', (evento) => {
    if (evento.key === 'Enter' && !evento.shiftKey){
      evento.preventDefault();
      const texto = entradaTexto.value.trim();
      if (texto){
        reproducirTexto(texto, null);
      }
    }
  });

  /* =========================================================
     INICIO
     ========================================================= */
  renderCategorias();
  renderGrid();
</script>

</body>
</html>
